[package]
name = "spcore"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Resona core (streaming client for Simple Player): library, sync, search, play order, equalizer and spectrum (shared logic of the Android app, mirrors the desktop app)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
